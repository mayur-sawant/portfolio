name: Streamlit App Health Check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Streamlit app
        run: |
          curl -L -sS --fail --max-time 60 \
            -o /dev/null \
            "https://mayursawant.streamlit.app/?embed=true"

          echo "Streamlit app is reachable."